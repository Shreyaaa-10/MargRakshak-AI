<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · MargRakshak AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <div data-sidebar></div>
  <main class="app-main">
    <h1 class="h2 mb-1">Analytics</h1>
    <p class="text-secondary mb-4">Chart.js with dummy numbers. Real scores will come from detection later.</p>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="app-card p-4">
          <h2 class="h5">Hourly drowsiness score</h2>
          <canvas id="drowsy-chart"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="app-card p-4">
          <h2 class="h5">Alert mix</h2>
          <canvas id="type-chart"></canvas>
        </div>
      </div>
      <div class="col-12">
        <div class="app-card p-4">
          <h2 class="h5">Weekly incidents</h2>
          <canvas id="week-chart"></canvas>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="js/dummy-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
