<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts · MargRakshak AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <div data-sidebar></div>
  <main class="app-main">
    <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
      <div>
        <h1 class="h2 mb-1">Alert history</h1>
        <p class="text-secondary mb-0">Dummy events. SQLite storage will replace this list later.</p>
      </div>
      <div>
        <label class="form-label small text-secondary" for="type-filter">Filter by type</label>
        <select class="form-select" id="type-filter">
          <option value="all">All types</option>
          <option>Drowsiness</option>
          <option>Yawn</option>
          <option>Head pose</option>
          <option>Distraction</option>
        </select>
      </div>
    </div>
    <div class="app-card p-3 overflow-auto">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Time</th>
            <th>Type</th>
            <th>Detail</th>
            <th>Severity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="alerts-body"></tbody>
      </table>
    </div>
  </main>
  <script src="js/dummy-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
