<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · MargRakshak AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <div data-sidebar></div>
  <main class="app-main">
    <h1 class="h2 mb-1">Settings</h1>
    <p class="text-secondary mb-4">These sliders are saved in the browser only. They will become real detection thresholds later.</p>
    <form id="settings-form" class="app-card p-4" style="max-width: 560px;">
      <label class="form-label" for="driverName">Driver name</label>
      <input class="form-control mb-3" id="driverName" name="driverName">
      <label class="form-label" for="vehicle">Vehicle number</label>
      <input class="form-control mb-3" id="vehicle" name="vehicle">
      <label class="form-label" for="ear">EAR drowsiness threshold</label>
      <input class="form-control mb-3" id="ear" name="ear" type="number" step="0.01" min="0.1" max="0.4">
      <label class="form-label" for="mar">MAR yawn threshold</label>
      <input class="form-control mb-3" id="mar" name="mar" type="number" step="0.01" min="0.3" max="1">
      <div class="form-check mb-3">
        <input class="form-check-input" id="notify" name="notify" type="checkbox">
        <label class="form-check-label" for="notify">Show on-screen alerts</label>
      </div>
      <button class="btn btn-amber" type="submit">Save settings</button>
      <p class="small mt-3 mb-0" id="save-msg"></p>
    </form>
  </main>
  <script src="js/dummy-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
