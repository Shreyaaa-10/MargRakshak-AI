<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · MargRakshak AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark public-nav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark">MR</span>
        <span class="brand-title">MargRakshak AI</span>
      </a>
    </div>
  </nav>
  <main class="container py-5" style="max-width: 480px;">
    <div class="login-card p-4 p-md-5">
      <h1 class="h2 mb-1">Supervisor login</h1>
      <p class="text-secondary">Dummy login only. Any name, email, and password will work. Nothing is sent to a server yet.</p>
      <form id="login-form">
        <label class="form-label mt-3" for="name">Full name</label>
        <input class="form-control" id="name" name="name" required placeholder="Your name">
        <label class="form-label mt-3" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required placeholder="you@college.edu">
        <label class="form-label mt-3" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
        <p class="text-danger small mt-2 mb-0" id="login-error"></p>
        <button class="btn btn-amber w-100 mt-4" type="submit">Enter dashboard</button>
      </form>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
